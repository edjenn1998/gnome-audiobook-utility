[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-audiobook-utility"
version = "0.1.0"
description = "Native GNOME audiobook conversion, merging and metadata tools"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = ["mutagen>=1.47,<2", "Pillow>=12.3,<14", "httpx>=0.28,<0.29", "audible==0.13.1", "SecretStorage>=3.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "build", "meson>=1.2", "ninja>=1.8"]

[project.scripts]
audiobook-utility = "audiobook_utility.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/audiobook_utility/ui.py" = ["E402"]
